<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <div>
        <label for="usuario" class="mb-1 block text-sm font-medium text-slate-700">
            Usuario
        </label>
        <input id="usuario" type="email" formControlName="usuario" autocomplete="username"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none" />
        @if (form.controls.usuario.invalid && form.controls.usuario.touched) {
        <p class="mt-1 text-xs text-red-600">Ingresa un correo válido.</p>
        }
    </div>

    @if (exito()) {
    <p class="text-center text-sm text-green-600">
        Se enviaron las nuevas credenciales al correo registrado.
    </p>
    }

    @if (error()) {
    <p class="text-center text-sm text-red-600">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()"
        class="mt-2 rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-700 disabled:opacity-60">
        {{ cargando() ? 'Enviando...' : 'Recuperar contraseña' }}
    </button>
    <a routerLink="/login" class="mt-2 text-center text-sm text-slate-600 transition hover:text-slate-800">
        Regresar al inicio de sesión
    </a>
</form>
